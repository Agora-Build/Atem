# Atem runtime - remote agent launch and directed work
# Installed automatically as ~/.config/atem/runtime.toml by `atem runtime start`.
# Keep the installed file private: chmod 0600 ~/.config/atem/runtime.toml
# Validate your changes with `atem runtime check` (requires pairing).
#
# Fill in approved profiles/routes below, then explicitly set enabled = true.
# Healthy enabled hosting keeps the runtime online with zero agent sessions.
# Boot startup needs a separately installed service. Local collaboration may
# launch an agent only when its route explicitly sets launch = "on_message"
# (a Claude Code profile) and the sender asks with `atem message send --launch`.
version = 1
enabled = false

# -- Local agent collaboration (optional, off by default) ----------------------
# Owner labels address agents, never authorize work. Names use 1-32 lowercase
# ASCII letters, digits or hyphens. At most 64 labels per instance or route.
# Agents may add only their own self: labels with `atem agent tag`.
# [instance]
# labels = ["project:backend", "tag:workstation"]
#
# [collab]
# send = false
# per_hour = 30
# per_workflow = 8        # messages per workflow, however many agents each reaches
# result_timeout = "30m"  # 1s-24h; automatic status never completes a task

# -- Who may launch and send work ---------------------------------------------
# A profile or route that lists no `principals` is open to the Astation this
# Atem is paired with (`member:<its id>`, the ID `atem status` shows on its
# Pairing line). List principals on a profile or route only to allow other
# devices or services. `atem runtime check` lists the members and services of
# your device list with their exact IDs and whether each may launch.

# -- Approved launch profiles -------------------------------------------------
# Uncomment a profile and replace its example path and Git project.
# cwd must be the existing canonical absolute directory (resolve symlinks).
# project is the cwd's normalized Git remote, without its scheme, user or .git
# suffix; a folder that isn't a Git repository: `local:<folder name>`.
# principals (optional, see above) are enrolled member/service/browser IDs,
# not hostnames or logins. These local approvals supplement the caller's
# current account permissions.
# Increase revision when changing a profile's approvals or launch settings.
#
# Codex example: runs `codex --profile oss` in the approved directory.
# [[profiles]]
# id = "backend-codex"
# revision = 1
# label = "Backend Codex"
# provider = "codex"
# cwd = "/absolute/canonical/path/to/backend"
# project = "github.com/your-org/backend"
# args = ["--profile", "oss"]
# principals = ["member:YOUR_ASTATION_ID", "service:YOUR_SERVICE_ID"]  # optional; replaces the paired Astation
# env_names = ["OSS_API_KEY"]
#
# Optional private JSON object of variable names to string values (never sourced).
# Only names in this profile's env_names may appear; file values override exports.
# Keep the environment file private (0600); do not put credential values here.
# env_file = "/absolute/private/backend-env.json"
#
# Claude example: runs `claude --model sonnet` in the approved directory.
# [[profiles]]
# id = "mobile-claude"
# revision = 1
# label = "Mobile Claude"
# provider = "claude"
# cwd = "/absolute/canonical/path/to/mobile"
# project = "github.com/your-org/mobile"
# args = ["--model", "sonnet"]
# principals = ["member:YOUR_ASTATION_ID", "service:YOUR_SERVICE_ID"]  # optional; replaces the paired Astation
# env_names = ["ANTHROPIC_BASE_URL", "ANTHROPIC_AUTH_TOKEN"]
# env_file = "/absolute/private/mobile-env.json"
#
# Remote callers select a profile; they cannot supply commands, paths, args or
# environment values. List the provider variables your setup needs in env_names.
# Named exports are captured when a new runtime starts with hosting enabled.
# Repeating `runtime start` reuses the process and does not update its environment.
# An approved env_file can supply values independently of the terminal's exports.

# -- Notification routes ------------------------------------------------------
# Enabled hosting also accepts text/context notices from authenticated native
# members. Ordinary notices do not need a profile principal entry or start work.
# Services need the scoped "message" op. Executable message recipients also
# need "notify" and "prompt" plus the route's explicit principal approval.
# Inspect delivery through the publishing client's message/task receipts.
#
# A route selects an approved profile and the principals allowed to send work.
# Work targets an existing session matching that profile's project/provider/cwd.
# A coordinator may explicitly launch a session first, then enqueue work.
# Remote launch-on-notification is not implemented. Local collaboration can
# opt in per route (below). Busy agents, drafts, approvals and active control
# leases hold work until safe delivery is possible.
# Increase revision when changing a route's approvals or selected profile.
#
# [[routes]]
# id = "backend"
# revision = 1
# profile_id = "backend-codex"
# principals = ["member:YOUR_ASTATION_ID", "service:YOUR_SERVICE_ID"]  # optional; replaces the paired Astation
#
# [[routes]]
# id = "mobile"
# revision = 1
# profile_id = "mobile-claude"
# principals = ["member:YOUR_ASTATION_ID", "service:YOUR_SERVICE_ID"]  # optional; replaces the paired Astation
#
# Local collaboration requires explicit route consent: add "local" to that
# route's principals. "local" is never valid in a profile's launch principals.
# A route's own principals replaces the paired-Astation default: list
# "member:YOUR_ASTATION_ID" beside "local" if the route should keep serving it.
# These optional keys belong to a [[routes]] table:
# labels = ["tag:mobile"]
# launch = "off"          # "on_message": `atem message send --launch` may start
#                         # this route's profile when no agent runs; Claude Code
#                         # profiles only for now (a Codex route is refused)
# results = false         # opt in to receive correlated results as agent input
# auto_report = "status"  # "final_message" opts in to assistant-text reports
#
# Inside an Atem-launched agent, after enabling [collab] and route consent:
#   atem message send --to tag:mobile "Review the mobile API contract"
#   atem message reply --task TASK_ID "Contract verified"
# Read progress with `atem message status MESSAGE_ID`.
# See ../designs/agent-collaboration.md in the source tree for a full example.
