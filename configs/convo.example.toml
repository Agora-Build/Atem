# atem serv convo — ConvoAI agent configuration
# Copy to ~/.config/atem/convo.toml (chmod 0600 — contains API keys)
#
# Override per-command via CLI: --channel, --rtc-user-id, --agent-user-id, --config
#
# The schema has two top-level sections atem cares about:
#   [atem]   — atem's runtime control surface (channel, RTC uid, HIPAA,
#              geofence, encryption, avatar opt-in)
#   [agent]  — everything about the AI agent (its uid, idle timeout,
#              presets, and the LLM / ASR / TTS / avatar provider blocks)
# plus pass-through tables atem forwards verbatim to ConvoAI's /join body:
#   [advanced_features], [vad], [sal], [parameters]

# ── [atem] — runtime control surface ────────────────────────────────
[atem]
# Channel is auto-generated when omitted:
#   "atem-convo-<app_id[..12]>-<ts>-<rand4>"
# Pin a fixed channel only when you need a stable name across runs.
# channel = "demo"

rtc_user_id = "0"           # human's RTC uid ("0" = server-assigned)

# Active pipeline. Either pipeline can be parked in this file; this
# field decides which one /join receives. Auto-detected when omitted
# (cascaded if [agent.asr/llm/tts] present, mllm if [agent.mllm]
# present); set explicitly when both are parked.
pipeline = "cascaded"        # "cascaded" | "mllm"

# Background-mode status poll cadence (seconds). Each `--background`
# daemon hits Agora's GET /agents/{id} every N seconds and writes
# the result to its registry JSON so `atem serv list` shows STATUS
# without a network call. Default 60. Lower for faster fleet
# visibility (40 daemons at 20s ≈ 2 calls/sec sustained, well within
# rate limits). Floored to 5. Foreground mode ignores this field.
# poll_interval_secs = 60

# ConvoAI REST environment — which endpoint the /join, /leave, and status
# calls use. Built-in choices (a single one is active at a time; the web UI
# shows them as radio buttons):
#   ga    → https://api.agora.io/api/...              (default, general availability)
#   eap   → https://partner.ai.agora.io/preview/api/...  (Early Access Preview;
#           live/MLLM models. atem sends the `agora-feature: live-models`
#           header. Requires Agora to allowlist your project.)
#   hipaa → https://api.agora.io/hipaa/api/...         (forces NORTH_AMERICA +
#           AES_256_GCM2; requires Agora Support to enable HIPAA.)
env = "ga"

# Optional allowlist — show only these environments in the web UI (in this
# order). Omit to show all available. e.g. envs = ["ga", "eap"] hides HIPAA.
# Hosts/prefixes still come from the built-in defaults unless overridden below.
# envs = ["ga", "eap"]

# The legacy `hipaa = true` still works — it's an alias for `env = "hipaa"`.
# hipaa = false

# Add or override environments here — no code change needed. Each entry
# becomes a selectable radio in the web UI. Merged over the built-ins by
# `name` (matching name overrides, new name adds). ATEM_CONVOAI_API_URL, if
# set, overrides the host of the built-in ga/hipaa.
#
# [[atem.environments]]
# name    = "eap"
# host    = "https://partner.ai.agora.io"
# prefix  = "preview/api"
# label   = "EAP"                        # UI label (defaults to NAME uppercased)
# headers = { agora-feature = "live-models" }   # sent on every request
# # force_geofence        = "NORTH_AMERICA"      # optional: pin + lock geofence
# # force_encryption_mode = 8                    # optional: pin + lock encryption

# Geofence — restrict media routing region.
# Valid: GLOBAL | NORTH_AMERICA | EUROPE | ASIA | JAPAN | INDIA
# GLOBAL (or omitting the field) → no geofence sent.
geofence = "GLOBAL"

# Avatar opt-in. Defaults to false even when [agent.avatar] is
# configured below — fleet `--background` launches won't burn avatar
# minutes by accident. Note: avatar + encryption is currently
# incompatible (the avatar vendor joins the channel unencrypted).
enable_avatar = false

# RTC encryption. mode = 0 → off; the [atem.encryption] block is
# ignored entirely. When mode > 0, both the local browser SDK and the
# agent join with these settings — they MUST match exactly or audio
# fails silently.
[atem.encryption]
mode = 0
# key  = "your-key-here"                                  # required when mode > 0
# salt = "Q4mTLy5h9qtD46vrdMgotPH9WrZxDsLxThPD9vtlf+o="    # base64-32-bytes; required for gcm2 modes (7, 8)
# Agora encryption_mode integer reference:
#   1 AES_128_XTS         5 AES_128_GCM
#   2 AES_128_ECB         6 AES_256_GCM
#   3 AES_256_XTS         7 AES_128_GCM2  (needs salt)
#   4 SM4_128_ECB         8 AES_256_GCM2  (needs salt; recommended)
# Generate a fresh salt with:  openssl rand -base64 32

# ── [agent] — everything about the AI agent ─────────────────────────
[agent]
user_id           = "1001"   # the agent's RTC uid (voice)
idle_timeout_secs = 120      # server-side safety timeout (seconds)

# Presets — comma-separated. atem splits on `,` to render checkboxes
# on the web page (all checked by default); selected names are joined
# back with `,` and forwarded as `properties.preset` in the /join body.
# Empty / omitted → no presets sent (agent runs from the explicit
# [agent.llm] / [agent.asr] / [agent.tts] blocks below).
preset = "expertise_ai_poc, _akool_test_expertise"

# ── Avatar (optional) ────────────────────────────────────────────────
# Declaring [agent.avatar] makes the avatar block AVAILABLE; whether
# it actually goes into the /join body is gated by `enable_avatar`
# under [atem] (or the "Enable Avatar" checkbox on the web page).
#
# atem auto-generates agora_channel (= voice channel), agora_uid
# (random 5-digit), and agora_token (minted from active project's
# appid + cert) when not provided in [agent.avatar.params].
#
# vendor + avatar_id are required by Agora.
#
# [agent.avatar]
# vendor    = "akool"
# avatar_id = "dvp_Sean_agora"
#
# [agent.avatar.params]
# api_key     = "<vendor api key>"
# host        = "ws://..."                # vendor-specific endpoint
# agora_appid = "..."                     # override project for minting
# agora_token = "..."                     # pre-minted; atem uses verbatim

# ── LLM ──────────────────────────────────────────────────────────────
[agent.llm]
url              = "https://api.groq.com/openai/v1/chat/completions"
api_key          = "<llm api key>"
greeting_message = "Hi, how can I help?"
failure_message  = "Error, please hold on."

[[agent.llm.system_messages]]
role    = "system"
content = "You are a helpful conversational AI agent."

[agent.llm.params]
model = "openai/gpt-oss-120b"

# MCP (Model Context Protocol) servers — tools the agent can call.
# Forwarded as properties.llm.mcp_servers[]. atem auto-sets
# advanced_features.enable_tools = true when any MCP server is
# configured (unless you pin that field in [advanced_features]).
# For MLLM mode, put MCP servers under [[agent.mllm.mcp_servers]]
# instead (see the MLLM section below) — same shape, emitted as
# properties.mllm.mcp_servers[].
# Repeat the [[…]] block for multiple servers.
#
# [[agent.llm.mcp_servers]]
# name          = "agora"                  # ≤48 chars, letters + digits only
# endpoint      = "https://mcp.agora.io"
# transport     = "streamable_http"        # only value Agora accepts today
# allowed_tools = []                       # [] = all tools; supports "name", "prefix_*"
# timeout_ms    = 30000
#
# [agent.llm.mcp_servers.headers]          # sent on every MCP request (auth, etc.)
# Authorization = "Bearer <token>"

# ── ASR ──────────────────────────────────────────────────────────────
[agent.asr]
vendor   = "soniox"
language = "en-US"

[agent.asr.params]
api_key        = "<asr api key>"
language_hints = ["en"]
model          = "stt-rt-v3"

[agent.asr.params.turn_detector]
validate_asr_result_timestamp = false

# ── TTS ──────────────────────────────────────────────────────────────
[agent.tts]
vendor = "minimax"

[agent.tts.params]
key                   = "<tts api key>"
group_id              = "<minimax group id>"
model                 = "speech-02-turbo"
url                   = "wss://api-uw.minimax.io/ws/v1/t2a_v2"
english_normalization = true

[agent.tts.params.voice_setting]
voice_id = "pvc_voice_pamela_spanish_0919"
emotion  = "happy"

[agent.tts.params.audio_setting]
sample_rate = 16000

# ── MLLM (alternative to ASR + LLM + TTS) ───────────────────────────
# A single multimodal model that takes audio in and produces audio
# out. Activate by setting [atem].pipeline = "mllm" above. atem
# auto-injects `enable = true`, `input_modalities = ["audio"]`, and
# `output_modalities = ["text", "audio"]` so the agent actually
# emits audio.
#
# api_key, url, and greeting_message live at the TOP of [agent.mllm]
# per Agora's MLLM schema. Vendor-specific knobs (model, voice,
# instructions, …) go under [agent.mllm.params].
#
# [agent.mllm]
# vendor           = "openai"
# url              = "wss://api.openai.com/v1/realtime"
# api_key          = "<openai api key>"
# greeting_message = "Hello, I am ready to help."
#
# [agent.mllm.params]
# model        = "gpt-realtime"
# voice        = "alloy"          # alloy | echo | fable | onyx | nova | shimmer
# instructions = "You are a Conversational AI Agent, developed by Agora."
#
# MCP tools in MLLM mode — same shape as [[agent.llm.mcp_servers]], but
# under the mllm block. Emitted as properties.mllm.mcp_servers[]. atem
# auto-sets advanced_features.enable_tools = true when any are present.
#
# [[agent.mllm.mcp_servers]]
# name          = "kb"                     # ≤48 chars, letters + digits only
# endpoint      = "https://mcp-kb.example/mcp"
# transport     = "streamable_http"        # only value Agora accepts today
# allowed_tools = ["search_knowledge_base"]  # [] = all tools; supports "name", "prefix_*"
# timeout_ms    = 30000
#
# [agent.mllm.mcp_servers.headers]         # sent on every MCP request (auth, etc.)
# Authorization = "Bearer <token>"

# ── Pass-through tables (forwarded verbatim to Agora /join) ─────────
# Required for live transcription. Without `enable_rtm = true`,
# `data_channel = "rtm"`, and `transcript.enable_words = true`, the
# agent runs but never streams transcripts.

[advanced_features]
enable_rtm   = true
enable_sal   = true
enable_aivad = false

[vad]
silence_duration_ms = 800

[sal]
sal_mode = "locking"

[parameters]
audio_scenario = "default"
data_channel   = "rtm"       # transcripts via RTM (not RTC data stream)
# enable_dump  = true        # Agora server-side audio dump — enable only
                             # when troubleshooting with Agora support

[parameters.transcript]
enable_words = true

[parameters.turn_detector]
validate_asr_result_timestamp = false
