name: Test

# The release workflow's test steps, on pull requests and on demand, so a
# release is never the first time the tests run on macOS.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run tests (release build, as the release workflow does)
        run: cargo test --release --target ${{ matrix.target }} --no-fail-fast

      - name: Run session fixtures and the two-host r9 test (debug build)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --test runtime_fixtures_binary --test r9_two_hosts_binary
