name: Test

# The release workflow's test steps, on pull requests and on demand, so a
# release is never the first time the tests run on macOS.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run tests (release build, as the release workflow does)
        run: cargo test --release --target ${{ matrix.target }} --no-fail-fast

      # Every test binary with debug-only `#[ignore]` tests (they need the
      # test hooks in src/runtime/test_hooks.rs and the r9 host clock, which
      # release builds leave out, so the release run above ignores them):
      # run in a debug build, each test named in the log, and the step fails
      # if any of them is still ignored. Find them with
      #   grep -rlzP 'cfg_attr\(\s*not\(debug_assertions\),\s*ignore' tests
      - name: Run the debug-hook tests (debug build)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -o pipefail
          bins=(runtime_fixtures_binary runtime_build_binary membership_binary
                r9_two_hosts_binary r9_revoked_binary r9_multi_device_binary
                r9_push_binary)
          # Every binary with a debug-only ignore is in the list.
          for f in $(grep -rlzP 'cfg_attr\(\s*not\(debug_assertions\),\s*ignore' tests); do
            t=$(basename "$f" .rs)
            if [[ " ${bins[*]} " != *" $t "* ]]; then
              echo "::error::$t has debug-only tests; add it to this step"
              exit 1
            fi
          done
          args=()
          for t in "${bins[@]}"; do args+=(--test "$t"); done
          cargo test --no-fail-fast "${args[@]}" -- --format pretty 2>&1 \
            | tee debug-hook-tests.log
          if grep -E '^test .* \.\.\. ignored' debug-hook-tests.log; then
            echo "::error::tests were ignored in the debug build"
            exit 1
          fi
