name: Test

# The release workflow's test steps, on pull requests and on demand, so a
# release is never the first time the tests run on macOS.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run tests (release build, as the release workflow does)
        if: runner.os != 'Linux'
        run: cargo test --release --target ${{ matrix.target }} --no-fail-fast

      # macOS: the delegated clock's readings, printed (the run above captures
      # test output, so only pass or fail reaches the log). Read only:
      # `continuous_time_counts_from_boot` prints the gap between
      # mach_continuous_time and now − kern.boottime,
      # `ntp_gettime_reports_a_state` the state ntp_gettime reports, and the
      # ignored `real_os_report_macos` one JSON line of what `os::read()` sees
      # (src/runtime/host_clock/os.rs). The same build: nothing is rebuilt.
      # It runs even when the test step failed, so the readings still reach
      # the log (PR 4 re-review N4).
      - name: Print the macOS clock readings
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --release --target ${{ matrix.target }} --bin atem -- \
            --exact --nocapture --include-ignored \
            runtime::host_clock::os::tests::continuous_time_counts_from_boot \
            runtime::host_clock::os::tests::ntp_gettime_reports_a_state \
            runtime::host_clock::os::tests::real_os_report_macos \
            2>&1 | tee clock-readings.log
          if ! grep -qE '^test result: ok\. 3 passed; 0 failed;' clock-readings.log; then
            echo "::error::the macOS clock readings did not all run"
            exit 1
          fi

      # Linux: the cred agent locks its memory only when RLIMIT_MEMLOCK is
      # unlimited or at least 512 MiB (runners default to 8 MiB), so raise it
      # for this shell and everything it starts, then run the tests with the
      # real mlockall path: ATEM_TEST_REQUIRE_MLOCK makes the lock test fail
      # instead of skipping if the limit didn't take, and its rerun with
      # --nocapture shows in the log that it ran.
      - name: Run tests (release build, memory locking allowed)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          echo "RLIMIT_MEMLOCK: $(ulimit -l) (soft), $(ulimit -H -l) (hard)"
          if [ "$(ulimit -l)" != unlimited ] || [ "$(ulimit -H -l)" != unlimited ]; then
            echo "::error::RLIMIT_MEMLOCK was not raised for this shell"
            exit 1
          fi
          export ATEM_TEST_REQUIRE_MLOCK=1
          status=0
          cargo test --release --target ${{ matrix.target }} --no-fail-fast || status=$?
          cargo test --release --target ${{ matrix.target }} --bin atem -- --nocapture --exact \
            memory::agent_socket::tests::a_locked_agent_reads_in_only_the_pages_it_touches \
            | tee lock-test.log || status=1
          if ! grep -q 'a_locked_agent_reads_in_only_the_pages_it_touches: ran' lock-test.log; then
            echo "::error::the memory lock test did not run"
            status=1
          fi
          exit $status

      # The atem binary's release-only unit tests (`#[cfg(not(debug_assertions))]`:
      # they prove the debug-only hooks are compiled out, e.g. that a release
      # build can't turn on `host.delegated`), each by its exact name, in the
      # release build the step above made (nothing is rebuilt): the step
      # fails unless every one of them ran and passed, on every target.
      - name: Run the release-only unit tests (release build)
        shell: bash
        run: |
          set -o pipefail
          units=(runtime::test_hooks::tests::host_work_drive_is_off_in_release
                 runtime::test_hooks::tests::host_features_are_off_in_release
                 runtime::delegated::tests::release_builds_never_turn_on_host_features)
          # Every such test in src is in the list: a test fn whose attributes
          # (the lines above it, doc comments included) say
          # `cfg(not(debug_assertions))`. The scan is the same on every
          # target, so it runs on Linux (GNU awk) only.
          if [ "$RUNNER_OS" = Linux ]; then
            found=$(find src -name '*.rs' -print0 | xargs -0 awk '
              /^[[:space:]]*(pub(\([^)]*\))?[[:space:]]+)?(async[[:space:]]+)?fn[[:space:]]+[A-Za-z0-9_]+/ {
                if (attrs ~ /cfg\([[:space:]]*not\([[:space:]]*debug_assertions[[:space:]]*\)[[:space:]]*\)/ &&
                    attrs ~ /#\[(tokio::)?test[]( ]/) {
                  sub(/^.*fn[[:space:]]+/, ""); sub(/[^A-Za-z0-9_].*$/, ""); print
                }
                attrs = ""; next
              }
              /^[[:space:]]*$/ || /[;{}][[:space:]]*$/ { attrs = ""; next }
              { attrs = attrs " " $0 }')
            for n in $found; do
              if [[ " ${units[*]} " != *"::$n "* ]]; then
                echo "::error::$n is a release-only unit test; add it to this step's units"
                exit 1
              fi
            done
          fi
          cargo test --release --target ${{ matrix.target }} --bin atem -- --exact --format pretty "${units[@]}" 2>&1 \
            | tee release-unit-tests.log
          for u in "${units[@]}"; do
            if ! grep -qxF "test $u ... ok" release-unit-tests.log; then
              echo "::error::$u did not run in the release build"
              exit 1
            fi
          done
          if ! grep -qE "^test result: ok\. ${#units[@]} passed;" release-unit-tests.log; then
            echo "::error::the release-only unit tests did not all run"
            exit 1
          fi

      # Every test binary with debug-only `#[ignore]` tests (they need the
      # test hooks in src/runtime/test_hooks.rs and the r9 host clock, which
      # release builds leave out, so the release run above ignores them):
      # run in a debug build, each test named in the log, and the step fails
      # if any of them is still ignored. Find them with
      #   grep -rlzP 'cfg_attr\(\s*not\(debug_assertions\),\s*ignore' tests
      - name: Run the debug-hook tests (debug build)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -o pipefail
          bins=(runtime_fixtures_binary runtime_build_binary membership_binary
                r9_two_hosts_binary r9_revoked_binary r9_multi_device_binary
                r9_push_binary r9_services_binary worker_binary host_work_binary
                collab_binary)
          # Every binary with a debug-only ignore is in the list.
          for f in $(grep -rlzP 'cfg_attr\(\s*not\(debug_assertions\),\s*ignore' tests); do
            t=$(basename "$f" .rs)
            if [[ " ${bins[*]} " != *" $t "* ]]; then
              echo "::error::$t has debug-only tests; add it to this step"
              exit 1
            fi
          done
          args=()
          for t in "${bins[@]}"; do args+=(--test "$t"); done
          cargo test --no-fail-fast "${args[@]}" -- --format pretty 2>&1 \
            | tee debug-hook-tests.log
          if grep -E '^test .* \.\.\. ignored' debug-hook-tests.log; then
            echo "::error::tests were ignored in the debug build"
            exit 1
          fi
          # The atem binary's debug-only unit tests (`#[cfg(debug_assertions)]`,
          # so the release run above doesn't even build them, or ignored in
          # release with `cfg_attr(not(debug_assertions), ignore)`), each by
          # its exact name: the step fails unless every one of them ran and
          # passed.
          units=(runtime::host_bridge::tests::the_drive_hook_plays_host_works_side_through_the_bridge)
          # Every such test in src is in the list: a test fn whose attributes
          # (the lines above it, doc comments included) say either form.
          # Gate tests one by one: a test in a debug-only module isn't seen.
          found=$(find src -name '*.rs' -print0 | xargs -0 awk '
            /^[[:space:]]*(pub(\([^)]*\))?[[:space:]]+)?(async[[:space:]]+)?fn[[:space:]]+[A-Za-z0-9_]+/ {
              if ((attrs ~ /cfg\([[:space:]]*debug_assertions[[:space:]]*\)/ ||
                   attrs ~ /cfg_attr\([[:space:]]*not\([[:space:]]*debug_assertions[[:space:]]*\)[[:space:]]*,[[:space:]]*ignore/) &&
                  attrs ~ /#\[(tokio::)?test[]( ]/) {
                sub(/^.*fn[[:space:]]+/, ""); sub(/[^A-Za-z0-9_].*$/, ""); print
              }
              attrs = ""; next
            }
            /^[[:space:]]*$/ || /[;{}][[:space:]]*$/ { attrs = ""; next }
            { attrs = attrs " " $0 }')
          for n in $found; do
            if [[ " ${units[*]} " != *"::$n "* ]]; then
              echo "::error::$n is a debug-only unit test; add it to this step's units"
              exit 1
            fi
          done
          cargo test --bin atem -- --exact --format pretty "${units[@]}" 2>&1 \
            | tee debug-unit-tests.log
          for u in "${units[@]}"; do
            if ! grep -qxF "test $u ... ok" debug-unit-tests.log; then
              echo "::error::$u did not run in the debug build"
              exit 1
            fi
          done
          if ! grep -qE "^test result: ok\. ${#units[@]} passed;" debug-unit-tests.log; then
            echo "::error::the debug-only unit tests did not all run"
            exit 1
          fi

      # The delegated clock's time-namespace guard against a real namespace
      # (host-work-v1 §11.6 "one boot", Decision 17): the ignored test
      # `timens_offset_is_seen_in_a_time_namespace` checks that the reading
      # reports the boot-time offset `unshare --time --boottime=86400` gives
      # its children and that the clock state's guard sees it. A new time
      # namespace needs privilege, so the bin's unit-test binary runs under
      # sudo, forked into it. It is the release test binary the earlier step
      # built (the same cargo flags, so `--no-run` only reports it); cargo's
      # JSON output names it. Fails when no binary is found, the test fails or
      # no test ran: zero tests passed is no pass.
      - name: Run the time-namespace clock test (unshare --time)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --target ${{ matrix.target }} --bin atem --no-run --message-format=json \
            > "$RUNNER_TEMP/atem-test-build.json"
          BIN=$(jq -rs '[.[] | select(.reason == "compiler-artifact" and .target.name == "atem"
                                      and (.target.kind | index("bin")) and .profile.test and .executable)
                         | .executable] | unique
                        | if length == 1 then .[0] else error("expected one atem test binary, found \(length)") end' \
            "$RUNNER_TEMP/atem-test-build.json")
          test -x "$BIN"
          echo "test binary: $BIN"
          TEST=runtime::host_clock::os::tests::timens_offset_is_seen_in_a_time_namespace
          sudo unshare --time --boottime=86400 --fork "$BIN" --exact "$TEST" --ignored --nocapture \
            2>&1 | tee "$RUNNER_TEMP/timens-test.log"
          if ! grep -qE '^test result: ok\. 1 passed; 0 failed;' "$RUNNER_TEMP/timens-test.log"; then
            echo "::error::the time-namespace test did not run and pass"
            exit 1
          fi
