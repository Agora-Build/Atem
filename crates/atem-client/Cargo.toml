[package]
name = "atem-client"
version = "0.1.0"
edition = "2024"
description = "atem-session r9 shared client core: canonical encoding, domain-separated signing, Recovery Kit and K-backup formats (sans-I/O)"
publish = false

[dependencies]
base64 = "0.22"
serde_json = "1.0"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
subtle = "2"
zeroize = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
p256 = { version = "0.13", features = ["ecdsa"] }
ed25519-dalek = { version = "2", features = ["zeroize"] }
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
hpke = { version = "0.12", default-features = false, features = ["alloc", "x25519"] }

[features]
# An in-memory `KeyProvider` (`SoftwareKeys`): for tests and for bots
# (`service` principals hold a software key, R9.6 rule 5). Native members
# use a platform provider (Secure Enclave, Android Keystore, WebCrypto).
software-keys = []

[dev-dependencies]
# The vector runner signs with the software provider.
atem-client = { path = ".", features = ["software-keys"] }
