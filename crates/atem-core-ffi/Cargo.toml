[package]
name = "atem-core-ffi"
version = "0.1.0"
edition = "2024"
description = "C ABI for atem-core (Agora RTC/RTM tokens), for Swift and other native hosts"
publish = false

[lib]
name = "atem_core_ffi"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
atem-core = { path = "../atem-core", features = ["serde"] }
serde_json = "1.0"
